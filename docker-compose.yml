services:
  # Development service
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    ports:
      - "13204:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./uploads:/app/public/uploads
    environment:
      - NODE_ENV=development
    command: pnpm run dev
    profiles:
      - dev

  # Production service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "13204:3000"
    volumes:
      - ./uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    profiles:
      - prod

  # Production service with nginx reverse proxy
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    profiles:
      - prod-nginx

  nginx:
    image: nginx:alpine
    ports:
      - "8081:8081"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-prod
    profiles:
      - prod-nginx
