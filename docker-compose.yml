services:
  # Development service
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/prescription}
    ports:
      - "13204:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./uploads:/app/public/uploads
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/prescription}
    command: pnpm run dev
    profiles:
      - dev

  # Production service
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/prescription}
    ports:
      - "13204:3000"
    volumes:
      - uploads_data:/app/public/uploads
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/prescription}
    restart: unless-stopped
    profiles:
      - prod

# Named volumes for persistent data
volumes:
  uploads_data: